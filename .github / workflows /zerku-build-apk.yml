name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Este archivo lleva el proyecto completo dentro: aquí se escribe en disco.
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p ZerkuChestMenu
          cd ZerkuChestMenu
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'ZERKU_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.zerku.chestmenu"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.zerku.chestmenu"
                  minSdk = 29          // Android 10
                  targetSdk = 35       // funciona en Android 10 → 16
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          // Sin dependencias externas: solo el SDK de Android y la librería estándar de Kotlin.
          ZERKU_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'ZERKU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Dibujar el menú flotante sobre otras apps -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <!-- Mantener el menú vivo con un servicio en primer plano -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <!-- Mostrar la notificación del servicio en Android 13+ (opcional para el usuario) -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Zerku">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".overlay.OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_menu_overlay" />
                  </service>

              </application>
          </manifest>
          ZERKU_EOF
          mkdir -p 'app/src/main/java/com/zerku/chestmenu'
          cat > 'app/src/main/java/com/zerku/chestmenu/MainActivity.kt' <<'ZERKU_EOF'
          package com.zerku.chestmenu

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.zerku.chestmenu.overlay.OverlayService
          import com.zerku.chestmenu.sandbox.SandboxView
          import com.zerku.chestmenu.ui.Palette

          /** * Pantalla principal: botón para activar/cerrar el menú flotante y, debajo, * la arena del sandbox donde los cofres reaccionan a las dos opciones del menú. */
          class MainActivity : Activity() {

              private lateinit var actionButton: TextView
              private lateinit var statusText: TextView

              private val density: Float get() = resources.displayMetrics.density

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(buildContent())
              }

              override fun onStart() {
                  super.onStart()
                  OverlayService.stateListener = { refreshUi() }
                  refreshUi()
              }

              override fun onResume() {
                  super.onResume()
                  refreshUi()
              }

              override fun onStop() {
                  OverlayService.stateListener = null
                  super.onStop()
              }

              // ---------------------------------------------------------------- acciones

              private fun onActionButton() {
                  if (OverlayService.isRunning) {
                      OverlayService.stop(this)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(
                          this,
                          "Concede «Mostrar sobre otras apps» y vuelve a pulsar el botón",
                          Toast.LENGTH_LONG
                      ).show()
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  requestNotificationPermissionIfNeeded()
                  OverlayService.start(this)
              }

              private fun requestNotificationPermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQUEST_NOTIFICATIONS)
                  }
              }

              private fun refreshUi() {
                  val running = OverlayService.isRunning
                  actionButton.text = if (running) "CERRAR MENÚ FLOTANTE" else "ACTIVAR MENÚ FLOTANTE"
                  statusText.text = when {
                      running -> "Menú activo · arrástralo por la cabecera"
                      Settings.canDrawOverlays(this) -> "Permiso de superposición concedido"
                      else -> "Falta el permiso «Mostrar sobre otras apps»"
                  }
              }

              // ---------------------------------------------------------------- interfaz

              private fun buildContent(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Palette.BLACK)
                      setPadding(dp(16), dp(12), dp(16), dp(16))
                  }
                  root.setOnApplyWindowInsetsListener { view, insets ->
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val bars = insets.getInsets(
                              WindowInsets.Type.systemBars() or WindowInsets.Type.displayCutout()
                          )
                          view.setPadding(
                              dp(16) + bars.left, dp(12) + bars.top, dp(16) + bars.right, dp(16) + bars.bottom
                          )
                      }
                      insets
                  }

                  root.addView(TextView(this).apply {
                      text = "ZERKU CHEST MENU"
                      setTextColor(Palette.PURPLE_LIGHT)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      typeface = Typeface.DEFAULT_BOLD
                      letterSpacing = 0.12f
                  })
                  root.addView(TextView(this).apply {
                      text = "ENTORNO DE PRUEBAS · toca un cofre para abrirlo a mano"
                      setTextColor(Palette.TEXT_DIM)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      letterSpacing = 0.05f
                  }, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(2) })

                  actionButton = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Palette.TEXT)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      typeface = Typeface.DEFAULT_BOLD
                      letterSpacing = 0.1f
                      background = GradientDrawable().apply {
                          setColor(Palette.PURPLE_DARK)
                          cornerRadius = dp(14).toFloat()
                          setStroke(dp(2), Palette.PURPLE)
                      }
                      isClickable = true
                      setOnClickListener { onActionButton() }
                  }
                  root.addView(actionButton, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(52)
                  ).apply { topMargin = dp(16) })

                  statusText = TextView(this).apply {
                      setTextColor(Palette.TEXT_DIM)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      gravity = Gravity.CENTER
                  }
                  root.addView(statusText, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(8) })

                  // Marco con borde morado alrededor de la arena.
                  val frame = FrameLayout(this).apply {
                      setPadding(dp(2), dp(2), dp(2), dp(2))
                      background = GradientDrawable().apply {
                          setColor(Palette.PURPLE_DARK)
                          cornerRadius = dp(16).toFloat()
                      }
                      addView(SandboxView(this@MainActivity), FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      ))
                  }
                  root.addView(frame, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ).apply { topMargin = dp(14) })

                  return root
              }

              private fun dp(value: Int): Int = (value * density + 0.5f).toInt()

              private companion object {
                  const val REQUEST_NOTIFICATIONS = 42
              }
          }
          ZERKU_EOF
          mkdir -p 'app/src/main/java/com/zerku/chestmenu'
          cat > 'app/src/main/java/com/zerku/chestmenu/MenuState.kt' <<'ZERKU_EOF'
          package com.zerku.chestmenu

          /** * Estado compartido entre el menú flotante (que escribe) y el sandbox (que lee). * Ambos viven en el mismo proceso, así que basta con un singleton. * Las dos opciones empiezan siempre en OFF. */
          object MenuState {
              @Volatile
              var autoDestroy: Boolean = false

              @Volatile
              var autoOpen: Boolean = false

              fun reset() {
                  autoDestroy = false
                  autoOpen = false
              }
          }
          ZERKU_EOF
          mkdir -p 'app/src/main/java/com/zerku/chestmenu/overlay'
          cat > 'app/src/main/java/com/zerku/chestmenu/overlay/FloatingMenu.kt' <<'ZERKU_EOF'
          package com.zerku.chestmenu.overlay

          import android.content.Context
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.util.TypedValue
          import com.zerku.chestmenu.MenuState
          import com.zerku.chestmenu.ui.Palette
          import com.zerku.chestmenu.ui.ToggleSwitchView
          import kotlin.math.abs
          import kotlin.math.roundToInt

          /** * Menú flotante: ventana de superposición movible con dos interruptores * (AUTO DESTROY CHEST y AUTO OPEN CHEST) y botón para minimizar/restaurar. * * Arrastra la cabecera para moverlo. Al minimizar queda una burbuja "Z" que * también se arrastra; un toque la restaura. */
          class FloatingMenu(private val context: Context) {

              private val windowManager = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val density = context.resources.displayMetrics.density

              private val params = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.WRAP_CONTENT,
                  WindowManager.LayoutParams.WRAP_CONTENT,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                  PixelFormat.TRANSLUCENT
              ).apply {
                  gravity = Gravity.TOP or Gravity.START
                  x = dp(16)
                  y = dp(140)
              }

              private val root = FrameLayout(context)
              private val expanded: LinearLayout = buildExpanded()
              private val bubble: FrameLayout = buildBubble()
              private var attached = false

              init {
                  root.addView(expanded)
                  root.addView(bubble)
                  bubble.visibility = View.GONE
              }

              // ---------------------------------------------------------------- API pública

              fun show() {
                  if (attached) return
                  windowManager.addView(root, params)
                  attached = true
              }

              fun hide() {
                  if (!attached) return
                  windowManager.removeView(root)
                  attached = false
              }

              // ---------------------------------------------------------------- construcción de la UI

              private fun buildExpanded(): LinearLayout {
                  val container = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(14))
                      background = GradientDrawable().apply {
                          setColor(Palette.withAlpha(Palette.PANEL, 0xF2))
                          cornerRadius = dp(18).toFloat()
                          setStroke(dp(2), Palette.PURPLE)
                      }
                      layoutParams = FrameLayout.LayoutParams(dp(236), ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  // Cabecera: título + botón minimizar. Es el "asa" para arrastrar.
                  val titleBlock = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(TextView(context).apply {
                          text = "ZERKU"
                          setTextColor(Palette.PURPLE_LIGHT)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                          typeface = Typeface.DEFAULT_BOLD
                          letterSpacing = 0.14f
                      })
                      addView(TextView(context).apply {
                          text = "CHEST MENU"
                          setTextColor(Palette.TEXT_DIM)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                          typeface = Typeface.DEFAULT_BOLD
                          letterSpacing = 0.22f
                      })
                  }

                  val minimizeButton = TextView(context).apply {
                      text = "—"
                      gravity = Gravity.CENTER
                      setTextColor(Palette.TEXT)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Palette.PANEL_ALT)
                          setStroke(dp(1), Palette.PURPLE_DARK)
                      }
                      isClickable = true
                      setOnClickListener { setMinimized(true) }
                  }

                  val header = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(titleBlock, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(minimizeButton, LinearLayout.LayoutParams(dp(30), dp(30)))
                      setOnTouchListener(DragListener(onTap = null))
                  }
                  container.addView(header)

                  // Separador.
                  container.addView(
                      View(context).apply { setBackgroundColor(Palette.withAlpha(Palette.PURPLE, 0x55)) },
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(1)).apply {
                          topMargin = dp(10)
                          bottomMargin = dp(4)
                      }
                  )

                  // Las dos únicas opciones.
                  container.addView(toggleRow("AUTO DESTROY CHEST", MenuState.autoDestroy) {
                      MenuState.autoDestroy = it
                  })
                  container.addView(toggleRow("AUTO OPEN CHEST", MenuState.autoOpen) {
                      MenuState.autoOpen = it
                  })

                  return container
              }

              private fun toggleRow(label: String, initial: Boolean, onChange: (Boolean) -> Unit): LinearLayout {
                  val switch = ToggleSwitchView(context).apply {
                      switchTo(initial, animate = false, notify = false)
                      onToggle = onChange
                  }
                  return LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
         
